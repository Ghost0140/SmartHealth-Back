# App
spring.application.name=doctores-service
server.port=8081

# Base de datos (Se agregó allowPublicKeyRetrieval=true)
spring.datasource.url=jdbc:mysql://localhost:3306/db_doctores?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA (Se cambió MySQL8Dialect por MySQLDialect)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Eureka (Comentado)
# eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# eureka.instance.prefer-ip-address=true
eureka.client.enabled=false

# Desactivar Config Server temporalmente
spring.cloud.config.enabled=false