spring.application.name=doctor-service
server.port=8082

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/db_doctor
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Llamada local a Auth para sincronizar la cuenta del doctor sin depender del registro Eureka.
smarthealth.services.auth-url=${SMARTHEALTH_AUTH_SERVICE_URL:http://localhost:8086}

# Clave compartida con auth-service: Base64, minimo 32 bytes.

# Clave JWT compartida: Base64, minimo 32 bytes.
security.jwt.secret-base64=${SMARTHEALTH_JWT_SECRET_BASE64}
