spring.application.name=appointment-service
server.port=8083

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/db_cita
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

smarthealth.chat.internal-token=${SMARTHEALTH_CHAT_INTERNAL_TOKEN:}

# Clave compartida con auth-service: Base64, minimo 32 bytes.

# Clave JWT compartida: Base64, minimo 32 bytes.
security.jwt.secret-base64=${SMARTHEALTH_JWT_SECRET_BASE64}
